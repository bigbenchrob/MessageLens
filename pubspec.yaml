  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Functional programming
  dartz: ^0.10.1

  # Database
  drift: ^2.28.0

  # Utilities
  intl: ^0.20.2
  http: ^1.4.0
  crypto: ^3.0.6
  path: ^1.9.1
  path_provider: ^2.1.5
  logger: ^2.6.1
  meta: ^1.16.0
  collection: ^1.19.1
  characters: ^1.4.0
  macos_ui: ^2.2.0
  macos_window_utils: ^1.5.0
  watcher: ^1.1.0
